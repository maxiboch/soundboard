# Qodana workflow for maxiboch's personal repos.
#
# Deliberately NOT workflows/qodana.yml. That one routes to
# [self-hosted, macOS, ARM64, tier-fast, container-runtime] -- runners
# registered to the maxi-tools ORG, which a personal repo cannot use. It also
# mints a maxi-tools App token for private crate deps that do not apply here.
#
# So: hosted Linux, where Docker is already present, and no App token.
# Each repo carries its own qodana.yaml naming the linter for its language.

name: Qodana

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    steps:
      # Fail loudly rather than scanning into the void. Without a project token
      # the linter cannot verify the licence, and an unlicensed run reports
      # nothing to Cloud while still looking like it worked.
      - name: Require Qodana Cloud token
        run: |
          if [ -z "${QODANA_TOKEN:-}" ]; then
            echo "::error::QODANA_TOKEN is not set. Provision it with scripts/qodana_provision.py --owner maxiboch in maxi-config."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history so PR mode can diff against the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Qodana Scan
        id: scan
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          # `upload-result: false` on purpose. It uploads a full HTML report to
          # GitHub artifacts on every run, and Qodana Cloud already stores that
          # -- per-project, with history. Duplicating it across ~90 repos is
          # what exhausted the account-wide artifact quota twice in one evening,
          # which then fails every OTHER workflow's uploads too, including the
          # lane-package -> lane-sign-publish handoff the release path needs.
          # The small SARIF is still uploaded below for diagnosing a red gate.
          upload-result: false
          use-caches: true
          post-pr-comment: ${{ github.event_name == 'pull_request' }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Assert the scan produced a report
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          set -euo pipefail
          sarif="$RUNNER_TEMP/qodana/results/qodana.sarif.json"
          if [ ! -s "$sarif" ]; then
            echo "::error::Qodana produced no SARIF at $sarif."
            exit 1
          fi
          echo "problems: $(python3 -c 'import json,sys; print(sum(len(r.get("results",[])) for r in json.load(open(sys.argv[1]))["runs"]))' "$sarif")"
